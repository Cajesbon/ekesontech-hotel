<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Golden Royale</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body class="login-page">

<div class="login-card">
  <div class="brand-mark">GR</div>
  <h2>Admin Sign In</h2>
  <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:24px;">Sign in to manage rooms, bookings, and hotel settings.</p>
  <div id="login-alert"></div>
  <form id="login-form">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username" />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" required autocomplete="current-password" />
        <button type="button" class="password-toggle-btn" data-toggle-for="password" aria-label="Show password">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;">Sign In</button>
  </form>
  <p class="login-footer-link">Work here but don't have access yet? <a href="/admin/signup.html">Request staff access</a></p>
</div>

<script src="/admin/js/password-toggle.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertEl = document.getElementById('login-alert');
  alertEl.innerHTML = '';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/admin/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok || data.success === false) throw new Error(data.message || 'Login failed.');
    window.location.href = '/admin/dashboard.html';
  } catch (err) {
    alertEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
});
</script>
</body>
</html>
