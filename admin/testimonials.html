<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Testimonials — Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">GR</span> Golden Royale admin</div>
    <nav>
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/bookings.html">Bookings</a>
      <a href="/admin/rooms.html">Rooms</a>
      <a href="/admin/facilities.html">Facilities</a>
      <a href="/admin/promotions.html">Promotions</a>
      <a href="/admin/gallery.html">Gallery</a>
      <a href="/admin/testimonials.html" class="active">Testimonials</a>
      <a href="/admin/messages.html">Messages</a>
      <a href="/admin/settings.html">Settings</a>
      <a href="/admin/staff.html" data-superadmin-only>Staff Accounts</a>
      <div class="nav-section-label">Account</div>
      <button class="logout-btn" id="logout-btn">Log Out</button>
    </nav>
  </aside>
  <main class="main-content">
    <div class="topbar">
      <div><button class="mobile-menu-btn" id="mobile-menu-btn">☰</button><h1>Testimonials</h1></div>
      <button class="btn btn-primary" id="add-testimonial-btn">+ Add Testimonial</button>
    </div>
    <div class="card">
      <div class="card-header">
        <select id="status-filter" style="padding:10px;border:1px solid var(--stone);border-radius:5px;">
          <option value="">All</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Guest</th><th>Rating</th><th>Message</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="testimonials-body"><tr class="skeleton-row"><td colspan="5"></td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="testimonial-modal" style="display:none;">
  <div class="modal">
    <div class="modal-header"><h3>Add Testimonial</h3><button class="modal-close" id="close-testimonial-modal">&times;</button></div>
    <div id="testimonial-alert"></div>
    <form id="testimonial-form">
      <div class="form-row">
        <div class="form-group"><label for="t-name">Guest name *</label><input type="text" id="t-name" required /></div>
        <div class="form-group"><label for="t-country">Country</label><input type="text" id="t-country" /></div>
      </div>
      <div class="form-group"><label for="t-rating">Rating *</label>
        <select id="t-rating"><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select>
      </div>
      <div class="form-group"><label for="t-message">Message *</label><textarea id="t-message" required></textarea></div>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>
</div>

<script src="/admin/js/admin-api.js"></script>
<script src="/admin/js/testimonials.js"></script>
</body>
</html>
