<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">GR</span> Golden Royale admin</div>
    <nav>
      <a href="/admin/dashboard.html" class="active">Dashboard</a>
      <a href="/admin/bookings.html">Bookings</a>
      <a href="/admin/rooms.html">Rooms</a>
      <a href="/admin/facilities.html">Facilities</a>
      <a href="/admin/promotions.html">Promotions</a>
      <a href="/admin/gallery.html">Gallery</a>
      <a href="/admin/testimonials.html">Testimonials</a>
      <a href="/admin/messages.html">Messages</a>
      <a href="/admin/settings.html">Settings</a>
      <a href="/admin/staff.html" data-superadmin-only>Staff Accounts</a>
      <div class="nav-section-label">Account</div>
      <button class="logout-btn" id="logout-btn">Log Out</button>
    </nav>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div>
        <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
        <h1>Dashboard</h1>
        <p style="color:var(--text-muted);margin:4px 0 0;">Welcome back, <span data-admin-name>—</span></p>
      </div>
      <a href="/" target="_blank" class="btn btn-outline">View Website ↗</a>
    </div>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="skeleton-row"><td></td></div></div>
    </div>

    <div class="card">
      <div class="card-header"><h3>Revenue (last 6 months)</h3></div>
      <div id="revenue-chart" style="height:220px;display:flex;align-items:end;gap:14px;padding:0 6px;"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>Recent bookings</h3>
        <a href="/admin/bookings.html" class="btn btn-outline btn-sm">View all</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Reference</th><th>Guest</th><th>Dates</th><th>Status</th><th>Payment</th><th>Total</th></tr></thead>
          <tbody id="recent-bookings-body">
            <tr class="skeleton-row"><td colspan="6"></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="/admin/js/admin-api.js"></script>
<script src="/admin/js/dashboard.js"></script>
</body>
</html>
