<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings — Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">A</span> Golden Royale admin</div>
    <nav>
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/bookings.html">Bookings</a>
      <a href="/admin/rooms.html">Rooms</a>
      <a href="/admin/facilities.html">Facilities</a>
      <a href="/admin/promotions.html">Promotions</a>
      <a href="/admin/gallery.html">Gallery</a>
      <a href="/admin/testimonials.html">Testimonials</a>
      <a href="/admin/messages.html">Messages</a>
      <a href="/admin/settings.html" class="active">Settings</a>
      <a href="/admin/staff.html" data-superadmin-only>Staff Accounts</a>
      <div class="nav-section-label">Account</div>
      <button class="logout-btn" id="logout-btn">Log Out</button>
    </nav>
  </aside>
  <main class="main-content">
    <div class="topbar">
      <div><button class="mobile-menu-btn" id="mobile-menu-btn">☰</button><h1>Hotel Settings</h1></div>
    </div>

    <div class="card">
      <h3>General information</h3>
      <div id="settings-alert"></div>
      <form id="settings-form">
        <div class="form-row">
          <div class="form-group"><label for="s-name">Hotel name</label><input type="text" id="s-name" /></div>
          <div class="form-group"><label for="s-tagline">Tagline</label><input type="text" id="s-tagline" /></div>
        </div>
        <div class="form-group"><label for="s-description">Description</label><textarea id="s-description"></textarea></div>
        <div class="form-group"><label for="s-address">Address</label><input type="text" id="s-address" /></div>
        <div class="form-row">
          <div class="form-group"><label for="s-phone">Phone</label><input type="text" id="s-phone" /></div>
          <div class="form-group"><label for="s-whatsapp">WhatsApp number (with country code, no +)</label><input type="text" id="s-whatsapp" placeholder="2348012345678" /></div>
        </div>
        <div class="form-group"><label for="s-email">Email</label><input type="email" id="s-email" /></div>
        <div class="form-row">
          <div class="form-group"><label for="s-checkin">Check-in time</label><input type="time" id="s-checkin" /></div>
          <div class="form-group"><label for="s-checkout">Check-out time</label><input type="time" id="s-checkout" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="s-currency">Currency code</label><input type="text" id="s-currency" maxlength="3" /></div>
          <div class="form-group"><label for="s-symbol">Currency symbol</label><input type="text" id="s-symbol" maxlength="3" /></div>
          <div class="form-group"><label for="s-tax">Tax percentage (%)</label><input type="number" id="s-tax" min="0" max="100" step="0.1" /></div>
        </div>
        <div class="form-group"><label for="s-booking-policy">Booking policy</label><textarea id="s-booking-policy"></textarea></div>
        <div class="form-group"><label for="s-cancellation-policy">Cancellation policy</label><textarea id="s-cancellation-policy"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label for="s-facebook">Facebook URL</label><input type="text" id="s-facebook" /></div>
          <div class="form-group"><label for="s-instagram">Instagram URL</label><input type="text" id="s-instagram" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="s-twitter">Twitter / X URL</label><input type="text" id="s-twitter" /></div>
          <div class="form-group"><label for="s-map">Google Maps embed URL</label><input type="text" id="s-map" /></div>
        </div>
        <button type="submit" class="btn btn-primary">Save Settings</button>
      </form>
    </div>

    <div class="card">
      <h3>Change password</h3>
      <div id="password-alert"></div>
      <form id="password-form">
        <div class="form-row">
          <div class="form-group"><label for="current-password">Current password</label><input type="password" id="current-password" required /></div>
          <div class="form-group"><label for="new-password">New password</label><input type="password" id="new-password" required minlength="8" /></div>
        </div>
        <button type="submit" class="btn btn-dark">Update Password</button>
      </form>
    </div>
  </main>
</div>

<script src="/admin/js/admin-api.js"></script>
<script src="/admin/js/settings.js"></script>
</body>
</html>
